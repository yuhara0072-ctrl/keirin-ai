# Render Blueprint — https://render.com/docs/blueprint-spec
# 無料プラン + GitHub JSON 永続化（Persistent Disk 不要）

services:
  - type: web
    name: keirin-ai
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.enableXsrfProtection=false
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GITHUB_REPO
        value: yuhara0072-ctrl/keirin-ai
      - key: GITHUB_PERSIST_BRANCH
        value: data
      - key: GITHUB_TOKEN
        sync: false
      - key: KEIRIN_AUTH_USERNAME
        sync: false
      - key: KEIRIN_AUTH_PASSWORD
        sync: false
      - key: KEIRIN_ENABLE_HOME_GOALS
        value: "0"
